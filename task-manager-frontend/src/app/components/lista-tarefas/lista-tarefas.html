<div class="container">
  <h1>Gerenciador de Tarefas</h1>

  <button class="btn-novo" (click)="novaTarefa()">+ Nova Tarefa</button>

  <app-formulario-tarefa
    *ngIf="mostrarFormulario"
    [tarefa]="tarefaSelecionada"
    (salvo)="aoSalvar()"
    (cancelado)="aoCancelar()">
  </app-formulario-tarefa>

  <table *ngIf="tarefas.length > 0">
    <thead>
      <tr>
        <th>Título</th>
        <th>Descrição</th>
        <th>Status</th>
        <th>Data</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tarefa of tarefas">
        <td>{{ tarefa.titulo }}</td>
        <td>{{ tarefa.descricao }}</td>
        <td>
          <span [class]="tarefa.status === 'Concluída' ? 'status-concluida' : 'status-pendente'">
            {{ tarefa.status }}
          </span>
        </td>
        <td>{{ tarefa.dataCriacao | date:'dd/MM/yyyy' }}</td>
        <td>
          <button class="btn-editar" (click)="editarTarefa(tarefa)">Editar</button>
          <button class="btn-excluir" (click)="excluirTarefa(tarefa.id!)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="tarefas.length === 0">Nenhuma tarefa cadastrada.</p>
</div>
